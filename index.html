<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASK TRACKER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      background: linear-gradient(135deg, #0b111e 0%, #10192d 50%, #082032 100%);
      color: #e2e8f0;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 950px; }
    
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    
    h1 { 
      font-size: 42px; 
      font-weight: 900; 
      letter-spacing: -1px;
      color: #ffffff; 
      margin: 0; 
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); 
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .logo-custom {
      height: 150px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.8));
    }

    h1 span {
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-panel { display: flex; align-items: center; gap: 12px; }
    .user-email { font-size: 13px; color: #38bdf8; font-weight: 600; }
    
    .btn-auth {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-auth:hover { background: #ef4444; color: #fff; }

    /* Kad Login / Register */
    .auth-card {
      background: rgba(16, 25, 45, 0.8);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 16px;
      padding: 30px;
      max-width: 400px;
      margin: 40px auto;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(8px);
      text-align: center;
    }
    .auth-card h2 { margin-top: 0; color: #38bdf8; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .auth-btn-main {
      background: linear-gradient(90deg, #2563eb 0%, #0284c7 100%);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .auth-toggle { font-size: 12px; color: #94a3b8; margin-top: 15px; cursor: pointer; text-decoration: underline; }

    .card-input {
      background: rgba(16, 25, 45, 0.6);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(8px);
    }
    .input-label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #94a3b8; margin-bottom: 12px; display: block; }
    .form-row { display: flex; flex-direction: column; gap: 14px; }
    .input-group-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    
    input[type="text"], input[type="email"], input[type="password"], textarea, input[type="file"] {
      background: rgba(11, 17, 30, 0.8);
      border: 1px solid rgba(0, 210, 255, 0.2);
      color: #7dd3fc;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: all 0.3s ease;
    }
    input[type="text"] { flex: 2; min-width: 200px; }
    
    .date-picker-wrapper { position: relative; display: flex; align-items: center; }
    .hidden-date-input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
    .custom-date-btn {
      background: rgba(11, 17, 30, 0.8);
      border: 1px solid rgba(0, 210, 255, 0.2);
      color: #7dd3fc;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    textarea { width: 100%; resize: vertical; min-height: 70px; }

    button.add-btn {
      background: linear-gradient(90deg, #2563eb 0%, #0284c7 100%);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-end;
    }

    .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }
    .tab-btn { background: transparent; border: none; color: #64748b; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 8px; }
    .tab-btn.active { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }

    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
    li { background: rgba(16, 25, 45, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }

    .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
    .task-title { font-size: 17px; font-weight: 700; color: #38bdf8; }
    .task-desc { font-size: 14px; color: #94a3b8; white-space: pre-wrap; margin-top: 6px; }
    
    .doc-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 12px; background: rgba(56, 189, 248, 0.1); border: 1px dashed rgba(56, 189, 248, 0.4); color: #38bdf8; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; width: fit-content; }

    .meta-group { display: flex; gap: 24px; margin-top: 8px; }
    .meta-item { display: flex; flex-direction: column; }
    .meta-label { font-size: 10px; color: #64748b; font-weight: 800; }
    .meta-val { font-size: 12px; color: #cbd5e1; }

    .status-box { display: flex; align-items: center; gap: 10px; }
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-overdue { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .badge-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-done { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    
    .completed .task-title { color: #94a3b8; text-decoration: line-through; }
    .action-btn { background: transparent; border: none; cursor: pointer; font-size: 15px; opacity: 0.8; }
    .complete-btn { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; }
    .undo-btn { background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; color: #fbbf24; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; }

    .hidden { display: none !important; }
  </style>

  <!-- Import SDK Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config Rasmi Kau
    const firebaseConfig = {
      apiKey: "AIzaSyCeS-iRm-16eVziAfo6D6SXP_sVZkz_HEk",
      authDomain: "task-tracker-150ee.firebaseapp.com",
      projectId: "task-tracker-150ee",
      storageBucket: "task-tracker-150ee.firebasestorage.app",
      messagingSenderId: "1046347983012",
      appId: "1:1046347983012:web:16d59497424e955c7b9e31",
      measurementId: "G-VE21HSQSEQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.auth = auth;
    window.db = db;
    window.fbMethods = { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, where };
  </script>
</head>
<body>

<div class="container">
  <!-- Header App -->
  <div class="header-row">
    <h1>
      <img src="penang.png" alt="Jata Penang" class="logo-custom">
      <span>TASK TRACKER</span>
    </h1>
    <div id="userPanel" class="user-panel hidden">
      <span id="userEmailText" class="user-email"></span>
      <button class="btn-auth" onclick="handleLogout()">Log Keluar</button>
    </div>
  </div>

  <!-- Borang Auth (Login / Sign Up) -->
  <div id="authSection" class="auth-card">
    <h2 id="authTitle">Log Masuk Akaun</h2>
    <div class="auth-form">
      <input type="email" id="authEmail" placeholder="Emel">
      <input type="password" id="authPassword" placeholder="Kata Laluan">
      <button class="auth-btn-main" onclick="handleAuth()">Teruskan</button>
    </div>
    <div class="auth-toggle" onclick="toggleAuthMode()" id="authToggleText">Belum ada akaun? Daftar sekarang</div>
  </div>

  <!-- Kandungan Utama (App Task) -->
  <div id="appSection" class="hidden">
    <div class="card-input">
      <span class="input-label">TAMBAH KERJA BARU</span>
      <div class="form-row">
        <div class="input-group-top">
          <input type="text" id="taskInput" placeholder="NAMA KERJA">
          <div class="date-picker-wrapper">
            <input type="datetime-local" id="dueDateInput" class="hidden-date-input" onchange="updateDateDisplay()">
            <button type="button" class="custom-date-btn" onclick="openCalendar()">
              📅 <span id="dateBtnText">Pilih Due Date</span>
            </button>
          </div>
        </div>
        <textarea id="descInput" placeholder="DESCRIPTION / NOTA KERJA..."></textarea>
        <button class="add-btn" onclick="addTask()">+ TAMBAH KERJA</button>
      </div>
    </div>

    <div class="tabs-container">
      <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">📌 Kerja Aktif (<span id="countActive">0</span>)</button>
      <button class="tab-btn" id="tabCompleted" onclick="switchTab('completed')">✅ Slot Selesai (<span id="countCompleted">0</span>)</button>
    </div>

    <ul id="taskList"></ul>
  </div>
</div>

<script>
  let currentUser = null;
  let isSignUpMode = false;
  let currentTab = 'active';
  let userTasks = [];
  let unsubscribeFirestore = null;

  window.addEventListener('load', () => {
    const checkAuthInterval = setInterval(() => {
      if (window.auth) {
        clearInterval(checkAuthInterval);
        window.fbMethods.onAuthStateChanged(window.auth, (user) => {
          if (user) {
            currentUser = user;
            document.getElementById("userEmailText").innerText = user.email;
            document.getElementById("userPanel").classList.remove("hidden");
            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("appSection").classList.remove("hidden");
            listenToTasks();
          } else {
            currentUser = null;
            if (unsubscribeFirestore) unsubscribeFirestore();
            document.getElementById("userPanel").classList.add("hidden");
            document.getElementById("authSection").classList.remove("hidden");
            document.getElementById("appSection").classList.add("hidden");
          }
        });
      }
    }, 100);
  });

  function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    document.getElementById("authTitle").innerText = isSignUpMode ? "Daftar Akaun Baru" : "Log Masuk Akaun";
    document.getElementById("authToggleText").innerText = isSignUpMode ? "Dah ada akaun? Log masuk" : "Belum ada akaun? Daftar sekarang";
  }

  async function handleAuth() {
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value.trim();
    if (!email || !password) return alert("Sila masukkan emel & kata laluan!");

    try {
      if (isSignUpMode) {
        await window.fbMethods.createUserWithEmailAndPassword(window.auth, email, password);
      } else {
        await window.fbMethods.signInWithEmailAndPassword(window.auth, email, password);
      }
    } catch (err) {
      alert("Ralat: " + err.message);
    }
  }

  function handleLogout() {
    window.fbMethods.signOut(window.auth);
  }

  function listenToTasks() {
    const q = window.fbMethods.query(
      window.fbMethods.collection(window.db, "tasks"),
      window.fbMethods.where("uid", "==", currentUser.uid)
    );

    unsubscribeFirestore = window.fbMethods.onSnapshot(q, (snapshot) => {
      userTasks = [];
      snapshot.forEach((doc) => {
        userTasks.push({ id: doc.id, ...doc.data() });
      });
      renderTasks();
    });
  }

  async function addTask() {
    const titleInput = document.getElementById("taskInput");
    const dueDateInput = document.getElementById("dueDateInput");
    const descInput = document.getElementById("descInput");

    if (!titleInput.value.trim()) return alert("Sila masukkan nama kerja!");

    const now = new Date();
    const createdDate = now.toLocaleDateString('ms-MY') + ' ' + now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });

    await window.fbMethods.addDoc(window.fbMethods.collection(window.db, "tasks"), {
      uid: currentUser.uid,
      title: titleInput.value.trim(),
      desc: descInput.value.trim(),
      createdDate: createdDate,
      dueDate: dueDateInput.value,
      completed: false,
      completedDate: null
    });

    titleInput.value = "";
    dueDateInput.value = "";
    descInput.value = "";
    document.getElementById("dateBtnText").innerText = "Pilih Due Date";
  }

  async function toggleTask(id, currentStatus) {
    const taskRef = window.fbMethods.doc(window.db, "tasks", id);
    const now = new Date();
    const completedDate = !currentStatus ? now.toLocaleDateString('ms-MY') + ' ' + now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }) : null;

    await window.fbMethods.updateDoc(taskRef, {
      completed: !currentStatus,
      completedDate: completedDate
    });
  }

  async function deleteTask(id) {
    await window.fbMethods.deleteDoc(window.fbMethods.doc(window.db, "tasks", id));
  }

  function openCalendar() { document.getElementById("dueDateInput").showPicker(); }
  function updateDateDisplay() {
    const dateInput = document.getElementById("dueDateInput");
    const btnText = document.getElementById("dateBtnText");
    if (dateInput.value) {
      const d = new Date(dateInput.value);
      btnText.innerText = d.toLocaleDateString('ms-MY') + ' ' + d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
    } else {
      btnText.innerText = "Pilih Due Date";
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tabActive").classList.toggle("active", tab === 'active');
    document.getElementById("tabCompleted").classList.toggle("active", tab === 'completed');
    renderTasks();
  }

  function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    const activeTasks = userTasks.filter(t => !t.completed);
    const completedTasks = userTasks.filter(t => t.completed);

    document.getElementById("countActive").innerText = activeTasks.length;
    document.getElementById("countCompleted").innerText = completedTasks.length;

    const filtered = currentTab === 'completed' ? completedTasks : activeTasks;

    if (filtered.length === 0) {
      list.innerHTML = `<p style='text-align:center; color:#64748b;'>Tiada rekod dalam slot ${currentTab === 'completed' ? 'Selesai' : 'Aktif'}.</p>`;
      return;
    }

    const now = new Date();
    filtered.forEach((task) => {
      const li = document.createElement("li");
      let statusHtml = '<span class="badge badge-done">IN PROGRESS</span>';
      let formattedDue = "Tiada";

      if (task.dueDate) {
        const dueTime = new Date(task.dueDate);
        formattedDue = dueTime.toLocaleDateString('ms-MY') + ' ' + dueTime.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
        const diffMs = dueTime - now;

        if (diffMs < 0 && !task.completed) statusHtml = '<span class="badge badge-overdue">⚠️ OVERDUE</span>';
        else if (diffMs <= 86400000 && !task.completed) statusHtml = '<span class="badge badge-warning">⚡ DEKAT DUE</span>';
      }

      if (task.completed) {
        li.classList.add("completed");
        statusHtml = '<span class="badge badge-done">✓ SELESAI</span>';
      }

      li.innerHTML = `
        <div class="task-header">
          <div style="flex: 1;">
            <div class="task-title">${task.title}</div>
            ${task.desc ? `<div class="task-desc">${task.desc}</div>` : ''}
            <div class="meta-group">
              <div class="meta-item"><span class="meta-label">KEY-IN DATE</span><span class="meta-val">${task.createdDate}</span></div>
              <div class="meta-item"><span class="meta-label">DUE DATE</span><span class="meta-val">${formattedDue}</span></div>
              ${task.completedDate ? `<div class="meta-item"><span class="meta-label">DISIAPKAN PADA</span><span class="meta-val" style="color: #4ade80;">${task.completedDate}</span></div>` : ''}
            </div>
          </div>
          <div class="status-box">
            ${statusHtml}
            <button class="action-btn ${!task.completed ? 'complete-btn' : 'undo-btn'}" onclick="toggleTask('${task.id}', ${task.completed})">${!task.completed ? '✓ Tekan Selesai' : '↩ Batal Selesai'}</button>
            <button class="action-btn" style="color:#ef4444;" onclick="deleteTask('${task.id}')">✕</button>
          </div>
        </div>
      `;
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
